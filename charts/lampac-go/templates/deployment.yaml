apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lampac-go.fullname" . }}
  labels:
    {{- include "lampac-go.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # State is a single RWO volume; don't run two pods over the same PVC at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lampac-go.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lampac-go.selectorLabels" . | nindent 8 }}
      annotations:
        {{- if .Values.config.create }}
        checksum/config: {{ .Values.config.toml | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: lampac-go
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: LAMPAC_GO_REPO_ROOT
              value: {{ .Values.repoRoot | quote }}
            - name: LAMPAC_GO_ADDR
              value: ":{{ .Values.listenPort }}"
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.listenPort }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.repoRoot }}
            {{- if .Values.config.create }}
            - name: config
              mountPath: {{ .Values.repoRoot }}/config.toml
              subPath: config.toml
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "lampac-go.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.config.create }}
        - name: config
          configMap:
            name: {{ include "lampac-go.fullname" . }}-config
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
